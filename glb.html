<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>model</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
<script type="importmap">{ "imports": {
  "three": "./three/build/three.module.js",
  "three/addons/": "./three/examples/jsm/"
} }</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// GLB viewer with the same camera, spin and controls as the splat viewer (index.html).
// three.js 0.178.0 is bundled next to this page (./three), so nothing is fetched from elsewhere.
// Any animation baked into the GLB is ignored: the spin comes from the camera.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/*CONFIG*/
const CONFIG = {
  file: 'model.glb',
  target: null,            // orbit centre; null = centre of the model's bounding box
  distance: 2.0,
  elevation: 30, azimuth: 0, period: 31, fov: 40,
  minDistance: 0.4, maxDistance: 8, minElevation: -85, maxElevation: 85,
  background: [0, 0, 0],
  exposure: 1.0,
  idleResume: 0.1, spinRamp: 5
};
/*END CONFIG*/
const STILL = new URLSearchParams(location.search).has('still');

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = CONFIG.exposure;
const scene = new THREE.Scene(); scene.background = new THREE.Color(...CONFIG.background);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(CONFIG.fov, 1, 0.01, 200);

const draco = new DRACOLoader().setDecoderPath('./three/examples/jsm/libs/draco/gltf/').setDecoderConfig({ type: 'wasm' });
const gltf = await new GLTFLoader().setDRACOLoader(draco).loadAsync(CONFIG.file);
scene.add(gltf.scene);
const tgt = CONFIG.target ? new THREE.Vector3(...CONFIG.target) : new THREE.Box3().setFromObject(gltf.scene).getCenter(new THREE.Vector3());

let az = CONFIG.azimuth, el = CONFIG.elevation, dist = CONFIG.distance, lastInput = -1e9;
const rad = Math.PI / 180;
const ptrs = new Map(); let pinch0 = null;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); lastInput = performance.now(); });
canvas.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const [x0, y0] = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); lastInput = performance.now();
  if (ptrs.size === 1) { az -= (e.clientX - x0) * 0.3; el = Math.max(CONFIG.minElevation, Math.min(CONFIG.maxElevation, el + (e.clientY - y0) * 0.3)); }
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], dd = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch0) dist = Math.max(CONFIG.minDistance, Math.min(CONFIG.maxDistance, dist * pinch0 / dd));
    pinch0 = dd;
  }
});
const up = e => { ptrs.delete(e.pointerId); pinch0 = null; lastInput = performance.now(); };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => { e.preventDefault(); lastInput = performance.now(); dist = Math.max(CONFIG.minDistance, Math.min(CONFIG.maxDistance, dist * Math.exp(e.deltaY * 0.001))); }, { passive: false });

let prev = performance.now(), frames = 0;
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
  const idle = ptrs.size === 0 ? (now - lastInput) / 1000 - CONFIG.idleResume : -1;
  const ramp = idle <= 0 ? 0 : Math.min(1, idle / Math.max(CONFIG.spinRamp || 0, 1e-3));
  if (CONFIG.period && !STILL) az += 360 / CONFIG.period * dt * ramp * ramp * (3 - 2 * ramp);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (renderer.getPixelRatio() !== dpr) renderer.setPixelRatio(dpr);
  const sz = renderer.getSize(new THREE.Vector2());
  if (sz.x !== w || sz.y !== h) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  const ca = Math.cos(el * rad);
  camera.position.set(tgt.x + dist * ca * Math.sin(az * rad), tgt.y + dist * Math.sin(el * rad), tgt.z + dist * ca * Math.cos(az * rad));
  camera.lookAt(tgt);
  renderer.render(scene, camera);
  if (++frames === 3) document.body.dataset.ready = '1';
});
</script>
</body>
</html>
